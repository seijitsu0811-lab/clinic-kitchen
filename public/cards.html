<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隨餐營養衛教小卡</title>
<style>
  /* A6 小卡，A4 一頁四張，裁切後隨餐附上。
     只有覆核過的小卡會印出來 —— 未覆核的在後端就被標成 printable:false。 */
  :root {
    --ink:   #14201A;
    --ink-2: #3E4E45;
    --line:  #C9D3CB;
    --green: #1F6B4A;
    --bg:    #F7F8F5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 15px; line-height: 1.7;
  }
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .bar h1 { font-size: 17px; margin: 0; font-weight: 800; }
  .bar .meta { font-size: 13px; color: var(--ink-2); }
  .bar button {
    margin-left: auto; padding: 8px 20px; font-size: 14px; font-weight: 700;
    background: var(--green); color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  .warn {
    background: #FCF2E0; border: 1px solid #E5C88A; color: #7A5407;
    padding: 12px 16px; margin: 16px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
  }
  .sheet { display: flex; flex-wrap: wrap; gap: 10px; padding: 18px 20px 60px; }

  .card {
    width: 105mm; min-height: 74mm;
    background: #fff; border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 16px 14px; display: flex; flex-direction: column;
  }
  .card .who {
    font-size: 12px; color: var(--ink-2); display: flex; gap: 8px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 8px;
  }
  .card h2 { font-size: 16px; font-weight: 900; margin: 0 0 3px; line-height: 1.4; }
  .card .dish { font-size: 13px; font-weight: 700; color: var(--green); margin-bottom: 6px; }
  .card .ratio { font-size: 12px; color: var(--green); font-weight: 600; margin-bottom: 6px; }
  .card .story { font-size: 12.5px; color: var(--ink-2); line-height: 1.65; flex: 1; }
  .card .nums {
    margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--line);
    font-size: 12.5px; font-weight: 700; display: flex; gap: 12px; flex-wrap: wrap;
  }
  .empty { padding: 50px 20px; color: var(--ink-2); }

  @page { size: A4; margin: 8mm; }
  @media print {
    body { background: #fff; }
    .bar, .warn { display: none; }
    .sheet { padding: 0; gap: 0; }
    .card {
      border: 1px dashed #B9C3BB; border-radius: 0;
      width: 50%; height: 74mm; min-height: 0; break-inside: avoid;
    }
  }
</style>
</head>
<body>
<div class="bar">
  <h1>隨餐營養衛教小卡</h1>
  <span class="meta" id="meta"></span>
  <button onclick="window.print()">列印</button>
</div>
<div id="warnBox"></div>
<div class="sheet" id="sheet"><p class="empty">載入中…</p></div>

<script>
const qs = new URLSearchParams(location.search);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

async function load() {
  const sheet = document.getElementById('sheet');
  let user = null;
  try { user = JSON.parse(localStorage.getItem('kitchen_user') || 'null'); } catch (e) {}
  if (!user || !user.id) {
    sheet.innerHTML = '<p class="empty">請先從廚房系統登入，再由「套餐 → 衛教小卡」開啟這一頁。</p>';
    return;
  }
  const headers = { 'X-Kitchen-User-Id': String(user.id) };
  const pw = sessionStorage.getItem('kitchen_password');
  if (pw) headers['X-Kitchen-Password'] = pw;

  let d;
  try {
    const r = await fetch('/api/meals/cards/today?date=' + encodeURIComponent(qs.get('date') || ''), { headers });
    if (!r.ok) throw new Error('讀取失敗（' + r.status + '）');
    d = await r.json();
  } catch (e) {
    sheet.innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
    return;
  }

  document.getElementById('meta').textContent = d.date + '　共 ' + d.cards.length + ' 份餐點';

  if (d.blocked_count) {
    document.getElementById('warnBox').innerHTML =
      '<div class="warn">有 ' + d.blocked_count + ' 張小卡尚未經醫師／法遵覆核，已排除不印。' +
      '請到「套餐 → 衛教小卡」確認文案後標記覆核。</div>';
  }

  const printable = d.cards.filter(c => c.printable);
  if (!printable.length) {
    sheet.innerHTML = '<p class="empty">今天沒有可列印的小卡。' +
      (d.cards.length ? '（有出單，但小卡尚未覆核）' : '（今天沒有餐盒出單）') + '</p>';
    return;
  }

  sheet.innerHTML = printable.map(c => `
    <div class="card">
      <div class="who">
        <span>${esc(c.patient_name || '員工')}</span>
        <span>${esc(c.meal_time)}</span>
        <span>${esc(c.purchase_mode)}</span>
      </div>
      <h2>${esc(c.meal ? c.meal.headline : '')}</h2>
      <div class="dish">${esc(c.meal_name)}</div>
      <div class="ratio">${esc(c.meal ? c.meal.ratio_line : '')}</div>
      <div class="story">${esc(c.meal ? c.meal.story : '')}</div>
      <div class="nums">
        <span>餐盒 ${c.meal_kcal} 大卡</span>
        ${c.tonic_kcal != null ? `<span>精力湯 ${c.tonic_kcal} 大卡</span>` : ''}
        ${c.set_kcal != null ? `<span>整份 ${c.set_kcal} 大卡</span>` : ''}
      </div>
    </div>`).join('');
}
load();
</script>
</body>
</html>
