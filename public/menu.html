<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>喜悅診所 調理套餐菜單</title>
<style>
  /* 這一頁是給個案看的。字級與對比是硬規格，不要為了排版好看調小。
     店家名稱與價格永遠不會出現在這裡 —— 後端 /api/meals/menu/case 就不回傳這些欄位。 */
  :root {
    --ink:      #14201A;   /* 對主要背景對比 > 13:1 */
    --ink-2:    #3A4A42;   /* > 7:1 */
    --paper:    #FBFAF6;
    --card:     #FFFFFF;
    --line:     #DCE3DC;
    --green:    #1F6B4A;
    --green-bg: #EAF3ED;
    --pork:     #B3261E;
    --pork-bg:  #FBEBEA;
    --chick:    #8A5A08;
    --chick-bg: #FCF2E0;
    --fish:     #14508F;
    --beef:     #7A2E2E;   /* 對主背景 > 7:1 */
    --beef-bg:  #F7EDED;
    --fish-bg:  #E8F0FA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 22px;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 80px; }

  header {
    padding: 34px 0 24px;
    border-bottom: 3px solid var(--ink);
    margin-bottom: 28px;
  }
  h1 { font-size: 40px; font-weight: 900; margin: 0 0 10px; letter-spacing: .02em; }
  .who { font-size: 24px; font-weight: 700; color: var(--green); }

  /* 精力湯：每份套餐的固定標配，熱量依個案處方算出 */
  .tonic {
    background: var(--green-bg);
    border: 3px solid var(--green);
    border-radius: 16px;
    padding: 22px 26px;
    margin-bottom: 34px;
  }
  .tonic-label { font-size: 20px; font-weight: 700; color: var(--green); margin-bottom: 4px; }
  .tonic-name  { font-size: 32px; font-weight: 900; margin-bottom: 8px; }
  .tonic-num   { font-size: 26px; font-weight: 800; }
  .tonic-note  { font-size: 19px; color: var(--ink-2); margin-top: 6px; }

  .series { margin-bottom: 44px; }
  .series-name {
    font-size: 30px; font-weight: 900; margin: 0 0 6px;
    padding-bottom: 10px; border-bottom: 3px solid var(--line);
  }
  .series-tag { font-size: 20px; color: var(--ink-2); margin: 10px 0 20px; }

  .dish {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .dish-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag {
    font-size: 22px; font-weight: 900;
    padding: 4px 16px; border-radius: 999px;
    border: 2px solid currentColor;
  }
  .tag-豬 { color: var(--pork);  background: var(--pork-bg); }
  .tag-雞 { color: var(--chick); background: var(--chick-bg); }
  .tag-魚 { color: var(--fish);  background: var(--fish-bg); }
  /* 牛：2026-09 蛋白盒子的壽喜牛五花進來才有這一類。
     沒有這個色標的話牛肉那道會變成沒有樣式的白底 */
  .tag-牛 { color: var(--beef);  background: var(--beef-bg); }
  .dish-name { font-size: 34px; font-weight: 900; line-height: 1.35; }
  .dish-nums { font-size: 21px; color: var(--ink-2); }
  .dish-total {
    font-size: 25px; font-weight: 900; color: var(--ink);
    margin-top: 6px; padding-top: 10px; border-top: 2px dashed var(--line);
  }
  /* 專用的深琥珀色：--chick 用在大字標籤上沒問題，但這行是 18px 內文，
     依 AAA 需要 7:1，--chick 只有 5.92:1，所以這裡另外指定。 */
  .approx { font-size: 18px; font-weight: 700; color: #5F3D04; }

  /* ── 個管師那一條 ──────────────────────────────────────
     最常用的是手機，所以這條要黏在上面、按鈕大顆，單手按得到。
     切到「給客人看」時整條收起來，螢幕轉過去只剩菜單。 */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--ink); color: #fff;
    margin: 0 -20px 20px; padding: 12px 20px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .bar-title { font-size: 17px; font-weight: 800; letter-spacing: .04em; }
  .bar-sp { margin-left: auto; }
  .bar button {
    font: inherit; font-size: 17px; font-weight: 800;
    min-height: 48px; padding: 8px 18px; border-radius: 12px;
    border: 2px solid #fff; background: transparent; color: #fff; cursor: pointer;
  }
  .bar button.go { background: #fff; color: var(--ink); }

  /* 客人模式：一次只看一間，回頭的按鈕要在但不要搶戲 */
  .back {
    font: inherit; font-size: 17px; font-weight: 700;
    min-height: 48px; padding: 8px 16px; margin-bottom: 16px;
    border: 2px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--ink-2); cursor: pointer;
  }

  /* 選餐廳：客人模式一次一間，先由個管師挑 */
  .pick { display: grid; gap: 12px; margin-bottom: 28px; }
  .pick button {
    font: inherit; text-align: left; cursor: pointer;
    background: var(--card); border: 3px solid var(--line);
    border-radius: 16px; padding: 18px 22px; min-height: 64px;
  }
  .pick button { padding: 0; overflow: hidden; }
  .pick .p-cover {
    display: block; width: 100%; aspect-ratio: 20 / 9;
    object-fit: cover; background: var(--line); margin-bottom: 14px;
  }
  .pick .p-name { font-size: 26px; font-weight: 900; display: block; padding: 0 22px; }
  .pick .p-tag  { font-size: 18px; color: var(--ink-2); display: block; padding: 4px 22px 0; }
  .pick .p-n    { font-size: 17px; color: var(--green); font-weight: 800; display: block; padding: 6px 22px 18px; }

  /* 這個人不吃的：個管師看得到、標紅；客人模式整個不顯示 */
  .dish.avoid {
    border-color: var(--pork); background: var(--pork-bg);
  }
  .dish.avoid .dish-name { text-decoration: line-through; }
  .avoid-flag {
    display: inline-block; font-size: 18px; font-weight: 900;
    color: #fff; background: var(--pork);
    padding: 3px 12px; border-radius: 999px; margin-left: 8px;
  }
  .none-note { font-size: 19px; color: var(--ink-2); }

  /* 幾個人吃 → 要幾盒。當場就要答得出來 */
  .share {
    background: var(--card); border: 2px dashed var(--line);
    border-radius: 16px; padding: 18px 22px; margin-bottom: 28px;
  }
  .share-q { font-size: 21px; font-weight: 800; margin-bottom: 12px; }
  .share-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .share-btns button {
    font: inherit; font-size: 20px; font-weight: 800; cursor: pointer;
    min-width: 56px; min-height: 52px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--paper); color: var(--ink);
  }
  .share-btns button[aria-pressed="true"] {
    border-color: var(--green); background: var(--green-bg); color: var(--green);
  }
  .share-out { font-size: 21px; font-weight: 800; line-height: 1.9; }
  .share-out em { font-style: normal; color: var(--green); font-size: 25px; }

  /* ── 照片 ────────────────────────────────────────────
     客人模式：滿版大圖，一屏一道，看的是「這份餐長什麼樣」
     個管師模式：縮圖靠左，他要的是資訊密度不是視覺 */
  .dish { overflow: hidden; padding: 0; }
  .dish-body { padding: 20px 24px; }
  .dish-photo {
    display: block; width: 100%; aspect-ratio: 20 / 9;
    object-fit: cover; background: var(--line);
  }
  .dish.compact { display: flex; align-items: flex-start; gap: 0; }
  /* 縮圖固定正方形。用 height:auto 會被 flex 拉成細長條，
     一張 108×426 的照片看不出是什麼菜 */
  .dish.compact .dish-photo {
    width: 104px; min-width: 104px; height: 104px; aspect-ratio: 1 / 1;
  }
  .dish.compact .dish-body { flex: 1; padding: 14px 16px; }

  /* 客人模式的一道 = 一張卡片，留白拉開，讀起來不擠 */
  .guest .dish {
    border-width: 0; border-radius: 20px; margin-bottom: 26px;
    box-shadow: 0 2px 14px rgba(20,32,26,.08), 0 0 0 1px var(--line);
  }
  .guest .dish-name { font-size: 32px; }
  .guest .dish-body { padding: 22px 24px 24px; }
  .guest .series-name { border-bottom: 0; padding-bottom: 0; }
  .guest .series { margin-bottom: 20px; }

  .foot { font-size: 18px; color: var(--ink-2); border-top: 2px solid var(--line); padding-top: 20px; }
  .err  { font-size: 22px; color: var(--pork); padding: 40px 0; }

  @media (max-width: 520px) {
    body { font-size: 20px; }
    h1 { font-size: 32px; }
    .dish-name { font-size: 28px; }
    .tonic-name { font-size: 26px; }
    .series-name { font-size: 25px; }
  }
  @media print {
    body { background: #fff; }
    .dish, .tonic { break-inside: avoid; }
    .bar, .back, .share-btns, .pick { display: none !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="root"><p style="padding:40px 0">載入中…</p></div>

<script>
const qs = new URLSearchParams(location.search);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const ICON = { '豬': '🥓', '雞': '🍗', '魚': '🐟', '牛': '🥩', '蔬菜': '🥗' };

async function load() {
  const root = document.getElementById('root');
  let user = null;
  try { user = JSON.parse(localStorage.getItem('kitchen_user') || 'null'); } catch (e) {}
  if (!user || !user.id) {
    root.innerHTML = '<p class="err">請先從廚房系統登入後，再由「套餐 → 個案菜單」開啟這一頁。</p>';
    return;
  }

  const headers = { 'X-Kitchen-User-Id': String(user.id) };
  const pw = sessionStorage.getItem('kitchen_password');
  if (pw) headers['X-Kitchen-Password'] = pw;

  const url = '/api/meals/menu/case?prescription_id=' + encodeURIComponent(qs.get('prescription_id') || '')
            + '&powder_type=' + encodeURIComponent(qs.get('powder_type') || '袋裝');

  let d;
  try {
    const r = await fetch(url, { headers });
    if (!r.ok) throw new Error('讀取失敗（' + r.status + '）');
    d = await r.json();
  } catch (e) {
    root.innerHTML = '<p class="err">' + esc(e.message) + '</p>';
    return;
  }

  const tonicKcal = d.tonic.kcal;
  const avoid = (d.case && d.case.avoid) || [];

  // 兩種檢視共用同一份菜單，不做兩頁 —— 做兩頁的話禁忌邏輯會有兩份，遲早不一致。
  //   個管師：全部餐廳攤開，不吃的標紅留著（要看得到才知道為什麼不建議）
  //   客人  ：一次只看一間，不吃的整個不顯示
  let mode = 'staff';        // staff | guest
  let pickedSeries = null;   // 客人模式看哪一間
  let people = 1;            // 幾個人一起吃

  const num = (v, unit) => v == null ? '—' : v + ' ' + unit;

  function dishHtml(i) {
    const bad = avoid.includes(i.protein);
    if (bad && mode === 'guest') return '';        // 客人模式：不吃的不出現
    const photo = i.photo
      ? `<img class="dish-photo" src="photos/${encodeURIComponent(i.photo)}"
             alt="${esc(i.name)}" loading="lazy">` : '';
    return `
      <div class="dish${bad ? ' avoid' : ''}${mode === 'staff' ? ' compact' : ''}">
        ${photo}
        <div class="dish-body">
        <div class="dish-top">
          <span class="tag tag-${esc(i.protein)}">${ICON[i.protein] || ''} ${esc(i.protein)}</span>
          <span class="dish-name">${esc(i.name)}</span>
          ${bad ? `<span class="avoid-flag">不吃 ${esc(i.avoid_reason || i.protein)}</span>` : ''}
        </div>
        <div class="dish-nums">
          餐盒 ${i.kcal_unknown ? '熱量未提供' : i.kcal + ' 大卡'}${
            i.estimated ? ' <span class="approx">（約略值）</span>' : ''}
          ＋ 精力湯 ${tonicKcal != null ? tonicKcal : '—'} 大卡
          <br>蛋白質 ${num(i.protein_g, '公克')}${
            i.protein_g == null ? ' <span class="approx">（店家未提供）</span>'
            : (i.estimated ? ' <span class="approx">（約略值）</span>' : '')}
        </div>
        ${i.set_kcal != null ? `<div class="dish-total">整份套餐 ${i.set_kcal} 大卡</div>` : ''}
        </div>
      </div>`;
  }

  function seriesHtml(s) {
    const dishes = s.items.map(dishHtml).join('');
    if (!dishes.trim()) return '';                 // 整間都被擋掉就不顯示這一間
    return `
      <section class="series">
        <h2 class="series-name">${esc(s.name)}</h2>
        ${s.tagline ? `<p class="series-tag">${esc(s.tagline)}</p>` : ''}
        ${dishes}
      </section>`;
  }

  // 幾個人吃 → 要幾盒。個管師當場就要答得出來
  function shareHtml() {
    const rs = d.share_ratios || [{ people: 1, boxes: 1 }];
    const opts = rs.map(r => {
      const boxes = (r.people <= 1 && r.boxes <= 1)
        ? people : Math.ceil(people * r.boxes / r.people);
      const label = (r.people <= 1 && r.boxes <= 1) ? '一人一盒' : `${r.people} 人 ${r.boxes} 盒`;
      return `<div>${label} → 要 <em>${boxes}</em> 盒</div>`;
    }).join('');
    return `
      <div class="share">
        <div class="share-q">幾個人一起吃？</div>
        <div class="share-btns">
          ${[1, 2, 3, 4, 5, 6].map(n =>
            `<button aria-pressed="${n === people}" onclick="window.__setPeople(${n})">${n}</button>`).join('')}
        </div>
        <div class="share-out">${opts}</div>
        <div class="none-note">青菜可以另外加買，不佔盒數。</div>
      </div>`;
  }

  function render() {
    const staffBar = `
      <div class="bar">
        <span class="bar-title">個管師檢視</span>
        <span class="bar-sp"></span>
        <button onclick="window.__print()">存成 PDF</button>
        <button class="go" onclick="window.__guest()">👁 給客人看</button>
      </div>`;

    const head = `
      <header>
        <h1>調理套餐菜單</h1>
        ${d.case ? `<div class="who">${esc(d.case.name)} 專屬</div>` : ''}
      </header>

      <div class="tonic">
        <div class="tonic-label">每一份套餐都包含</div>
        <div class="tonic-name">${esc(d.tonic.name)}（${d.tonic.volume_ml} 毫升）</div>
        <div class="tonic-num">${tonicKcal != null ? tonicKcal + ' 大卡' : '熱量依處方計算'}${
          d.tonic.protein_g != null ? '　蛋白質 ' + d.tonic.protein_g + ' 公克' : ''}</div>
        <div class="tonic-note">這杯的熱量是依您的個人配方算出來的，和別人不一樣。</div>
      </div>`;

    const foot = `
      <p class="foot">
        熱量為每份的估計值，會因當日食材份量略有增減。<br>
        有任何飲食上的疑問，請直接告訴我們的護理人員。
      </p>`;

    // ── 個管師：全部攤開 ──────────────────────────────────
    if (mode === 'staff') {
      const warn = avoid.length
        ? `<div class="share" style="border-color:var(--pork)">
             <div class="share-q" style="color:var(--pork)">這位不吃：${avoid.map(esc).join('、')}</div>
             <div class="none-note">下面標紅的品項，切到「給客人看」時不會出現。
               ${d.case && d.case.note ? '備註：' + esc(d.case.note) : ''}</div>
           </div>`
        : '';
      root.innerHTML = staffBar + head + warn + shareHtml()
        + d.series.map(seriesHtml).join('') + foot;
      return;
    }

    // ── 客人：先挑一間，一次只看一間 ──────────────────────
    if (!pickedSeries) {
      const cards = d.series.map(s => {
        const n = s.items.filter(i => !avoid.includes(i.protein)).length;
        if (!n) return '';
        const cover = (s.items.find(i => i.photo && !avoid.includes(i.protein)) || {}).photo;
        return `<button onclick="window.__pick(${s.id})">
          ${cover ? `<img class="p-cover" src="photos/${encodeURIComponent(cover)}" alt="" loading="lazy">` : ''}
          <span class="p-name">${esc(s.name)}</span>
          ${s.tagline ? `<span class="p-tag">${esc(s.tagline)}</span><br>` : ''}
          <span class="p-n">${n} 道可選</span>
        </button>`;
      }).join('');
      root.innerHTML = `<button class="back" onclick="window.__staff()">← 回個管師檢視</button>`
        + head
        + `<h2 class="series-name">今天想吃哪一種？</h2><div class="pick">${cards}</div>`
        + foot;
      return;
    }

    const s = d.series.find(x => x.id === pickedSeries);
    root.innerHTML = `<button class="back" onclick="window.__unpick()">← 換一間</button>`
      + head + shareHtml() + (s ? seriesHtml(s) : '') + foot;
  }

  const _syncMode = () => document.body.classList.toggle('guest', mode === 'guest');
  window.__guest     = () => { mode = 'guest'; pickedSeries = null; _syncMode(); render(); window.scrollTo(0, 0); };
  window.__staff     = () => { mode = 'staff'; pickedSeries = null; _syncMode(); render(); window.scrollTo(0, 0); };
  window.__pick      = id => { pickedSeries = id; render(); window.scrollTo(0, 0); };
  window.__unpick    = () => { pickedSeries = null; render(); window.scrollTo(0, 0); };
  window.__setPeople = n => { people = n; render(); };
  window.__print     = () => window.print();

  render();
}
load();
</script>
</body>
</html>
